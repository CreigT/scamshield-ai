services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      DATA_DIR: /var/lib/scamshield
      HOUSEHOLD_HASH_SALT: ${HOUSEHOLD_HASH_SALT:-change-me}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      RATE_LIMIT_CHECKS_PER_MINUTE: "12"
    volumes:
      - scamshield-data:/var/lib/scamshield
    restart: unless-stopped

volumes:
  scamshield-data:
